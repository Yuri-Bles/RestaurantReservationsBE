name: Deploy

on:
  push:
    branches: [ "main", "Deployment" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Prepare SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Create secret files
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-secrets"
          umask 077
          printf '%s' "$DB_USERNAME" > "$RUNNER_TEMP/deploy-secrets/db_username.txt"
          printf '%s' "$DB_PASSWORD" > "$RUNNER_TEMP/deploy-secrets/db_password.txt"

      - name: Transfer secrets to VM
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p ~/RestaurantReservationsBE/secrets"

          scp "$RUNNER_TEMP/deploy-secrets/"*.txt \
            "$SERVER_USER@$SERVER_HOST:~/RestaurantReservationsBE/secrets/"

          ssh "$SERVER_USER@$SERVER_HOST" \
            "chmod 600 ~/RestaurantReservationsBE/secrets/*.txt"