services:

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: RestaurantReservations
      POSTGRES_USER_FILE: /run/secrets/DB_USERNAME
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: app_db_username
        target: DB_USERNAME
      - source: app_db_password
        target: DB_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - restaurant-reservation-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}:main
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://database:5433/RestaurantReservations
    secrets:
      - source: app_db_username
        target: spring.datasource.username
      - source: app_db_password
        target: spring.datasource.password
    depends_on:
      database:
        condition: service_healthy

secrets:
  app_db_username:
    environment: DB_USERNAME
  app_db_password:
    environment: DB_PASSWORD

volumes:
  restaurant-reservation-data: